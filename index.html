<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMatch: Which Pet Is Right for You?</title>
  <style>
    :root {
      --indigo: #313A70;
      --mustard: #FFB300;
      --terracotta: #C36040;
      --cream: #FBF7F1;
      --charcoal: #3D3D3D;
      --white: #FFFFFF;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--cream);
      color: var(--charcoal);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-card {
      background: var(--white);
      max-width: 600px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      color: var(--indigo);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 0.95rem;
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      background-color: #E8E3DC;
      height: 8px;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--terracotta);
      transition: width 0.3s ease;
    }

    /* Questions & Options */
    .question-title {
      font-size: 1.2rem;
      color: var(--indigo);
      margin-bottom: 16px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: var(--cream);
      border: 2px solid transparent;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1rem;
      color: var(--charcoal);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .option-btn:hover {
      border-color: var(--mustard);
      background: #FFFDF9;
      transform: translateY(-2px);
    }

    /* Results Screen */
    .result-container {
      display: none;
      text-align: center;
    }

    .pet-badge {
      display: inline-block;
      background: var(--mustard);
      color: var(--indigo);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .result-title {
      color: var(--indigo);
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .pet-image-box {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      margin: 16px 0;
    }

    .result-description {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 24px;
    }

    .cta-btn {
      background: var(--terracotta);
      color: var(--white);
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .cta-btn:hover {
      background: #a84f33;
    }

    .restart-btn {
      display: block;
      margin: 12px auto 0;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- Header -->
    <div class="header">
      <h1>PetMatch</h1>
      <p>Find your ideal rescue companion based on your lifestyle</p>
    </div>

    <!-- Progress -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Quiz Content -->
    <div id="quizContent">
      <h2 class="question-title" id="questionText">Loading...</h2>
      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <!-- Result Screen -->
    <div class="result-container" id="resultContainer">
      <span class="pet-badge">Your Match</span>
      <h2 class="result-title" id="matchTitle">...</h2>
      <div class="pet-image-box" id="matchImage"></div>
      <p class="result-description" id="matchDesc">...</p>
      <button class="cta-btn" onclick="alert('Redirecting to local available shelter pets!')">Meet Available Pets</button>
      <button class="restart-btn" onclick="restartQuiz()">Take Quiz Again</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "What does your current living situation look like?",
        options: [
          { text: "Apartment or condo with limited space", points: { cat: 3, small: 3, calm_dog: 1 } },
          { text: "House with a small yard or nearby park", points: { calm_dog: 3, cat: 2, active_dog: 1 } },
          { text: "Large house with a fenced, spacious yard", points: { active_dog: 3, calm_dog: 2 } },
          { text: "Rented room or shared living setup", points: { small: 3, cat: 2 } }
        ]
      },
      {
        question: "How would you describe your typical activity level?",
        options: [
          { text: "High energy: I love long runs, hikes, and outdoor sports", points: { active_dog: 3 } },
          { text: "Moderate: Daily casual walks and light weekend outings", points: { calm_dog: 3, cat: 1 } },
          { text: "Relaxed: Cozy nights in, reading, and watching movies", points: { cat: 3, small: 2 } },
          { text: "On-the-go: Busy schedule, away from home often", points: { cat: 2, small: 3 } }
        ]
      },
      {
        question: "How much time can you dedicate daily to pet care & interaction?",
        options: [
          { text: "Less than 1 hour a day", points: { small: 3, cat: 1 } },
          { text: "1 – 2 hours a day", points: { cat: 3, calm_dog: 2 } },
          { text: "2 – 4 hours a day", points: { calm_dog: 3, active_dog: 2 } },
          { text: "4+ hours (I work from home or have lots of free time)", points: { active_dog: 3, calm_dog: 2 } }
        ]
      },
      {
        question: "What is your prior experience with owning pets?",
        options: [
          { text: "First-time owner looking for an easy-going companion", points: { cat: 3, calm_dog: 2, small: 2 } },
          { text: "Some experience, comfortable with basic training", points: { calm_dog: 3, cat: 2 } },
          { text: "Experienced owner ready for a high-needs or high-energy rescue", points: { active_dog: 3 } }
        ]
      }
    ];

    const resultsData = {
      active_dog: {
        title: "An Active & Adventurous Dog",
        desc: "You have plenty of space, energy, and time to devote to a companion. A high-energy rescue dog who loves hiking, training, and playing fetch will fit right into your active lifestyle!",
        image: "https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?auto=format&fit=crop&w=800&q=80"
      },
      calm_dog: {
        title: "A Calm & Gentle Senior Dog",
        desc: "You offer a stable, comfortable home perfect for a dog that prefers relaxed strolls and couch cuddles. An older or easygoing dog will shower you with low-maintenance affection.",
        image: "https://images.unsplash.com/photo-1544568100-847a948585b9?auto=format&fit=crop&w=800&q=80"
      },
      cat: {
        title: "An Independent & Loving Cat",
        desc: "Your lifestyle balances cozy indoor vibes with manageable care needs. A rescue cat will love curling up in your lap, keeping you company, and staying content while you're busy.",
        image: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80"
      },
      small: {
        title: "A Pocket Pet or Small Companion",
        desc: "With limited space or time constraints, a small pet (like a bunny, guinea pig, or hamster) offers wonderful companionship, low-space needs, and tons of quiet charm.",
        image: "https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?auto=format&fit=crop&w=800&q=80"
      }
    };

    let currentQuestion = 0;
    let scores = { active_dog: 0, calm_dog: 0, cat: 0, small: 0 };

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("questionText").innerText = q.question;
      
      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.points);
        optionsContainer.appendChild(btn);
      });

      // Update progress bar
      const progressPercent = ((currentQuestion) / questions.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPercent}%`;
    }

    function selectOption(points) {
      for (let pet in points) {
        scores[pet] += points[pet];
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quizContent").style.display = "none";
      document.getElementById("progressContainer").style.display = "none";
      document.getElementById("resultContainer").style.display = "block";

      // Find pet type with highest score
      let winningPet = "cat";
      let maxScore = -1;
      for (let pet in scores) {
        if (scores[pet] > maxScore) {
          maxScore = scores[pet];
          winningPet = pet;
        }
      }

      const match = resultsData[winningPet];
      document.getElementById("matchTitle").innerText = match.title;
      document.getElementById("matchDesc").innerText = match.desc;
      document.getElementById("matchImage").style.backgroundImage = `url('${match.image}')`;
    }

    function restartQuiz() {
      currentQuestion = 0;
      scores = { active_dog: 0, calm_dog: 0, cat: 0, small: 0 };
      document.getElementById("quizContent").style.display = "block";
      document.getElementById("progressContainer").style.display = "block";
      document.getElementById("resultContainer").style.display = "none";
      loadQuestion();
    }

    // Initialize
    loadQuestion();
  </script>

</body>
</html>
