<!DOCTYPE html>
<html>
<head>
  <style>
    body { text-align: center; background: #FBF7F1; font-family: sans-serif; }
    #gameCanvas { background: #AFE2CF; border-radius: 12px; cursor: none; }
  </style>
</head>
<body>
  <h2>🍖 PetMatch: Treat Catch!</h2>
  <p>Score: <span id="score">0</span></p>
  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let playerX = 200;
    let treat = { x: Math.random() * 360 + 20, y: 0, speed: 4 };

    // Track mouse position
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      playerX = e.clientX - rect.left;
    });

    function update() {
      // Drop the treat down
      treat.y += treat.speed;

      // Check collision with player (Pet)
      if (treat.y >= 440 && Math.abs(treat.x - playerX) < 40) {
        score += 10;
        document.getElementById("score").innerText = score;
        resetTreat();
      }

      // Reset if treat missed
      if (treat.y > 500) resetTreat();

      draw();
      requestAnimationFrame(update);
    }

    function resetTreat() {
      treat.y = 0;
      treat.x = Math.random() * 360 + 20;
      treat.speed = 3 + Math.random() * 3; // Randomize speed
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Pet Basket / Player
      ctx.fillStyle = "#313A70";
      ctx.beginPath();
      ctx.arc(playerX, 460, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#FFF";
      ctx.fillText("🐶", playerX - 8, 465);

      // Draw Falling Treat
      ctx.fillStyle = "#C36040";
      ctx.beginPath();
      ctx.arc(treat.x, treat.y, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#FFF";
      ctx.fillText("🦴", treat.x - 7, treat.y + 4);
    }

    update();
  </script>
</body>
</html>
