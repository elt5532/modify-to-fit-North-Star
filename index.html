<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMatch: Full Room Playground</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: '#313A70',
            mustard: '#FFB300',
            terracotta: '#C3684D',
            cream: '#FAF1E4',
            mint: '#AFE2CF',
            charcoal: '#3D3D3D'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Fredoka', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #313A70;
      font-family: 'Inter', sans-serif;
      touch-action: none;
      overflow: hidden;
    }
    canvas {
      touch-action: none;
    }
    .toy-btn.active-toy {
      background-color: #FFB300 !important;
      color: #313A70 !important;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 179, 0, 0.4);
    }
    .toy-btn-cat.active-toy {
      background-color: #C3684D !important;
      color: #FFFFFF !important;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(195, 104, 77, 0.4);
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between text-charcoal bg-indigo">

  <!-- Top Navigation Header -->
  <header class="bg-white/95 backdrop-blur border-b-4 border-mustard px-4 py-2.5 sm:px-6 flex justify-between items-center shadow-md z-20">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-mustard flex items-center justify-center text-indigo text-xl font-bold shadow">
        <i class="fa-solid fa-paw"></i>
      </div>
      <div>
        <h1 class="font-display font-bold text-lg sm:text-xl text-indigo leading-tight">PetMatch: Full Room Playground</h1>
        <p class="text-xs text-terracotta font-semibold hidden sm:block">Interactive 2.5D Co-Play Experience</p>
      </div>
    </div>

    <!-- Header Controls -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <button id="soundToggle" class="bg-mint hover:bg-opacity-80 text-indigo font-semibold px-3 py-1.5 rounded-full text-xs sm:text-sm flex items-center space-x-1.5 transition shadow">
        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        <span id="soundLabel" class="hidden sm:inline">Sound: ON</span>
      </button>

      <button id="resetPetsBtn" class="bg-terracotta hover:bg-opacity-90 text-white font-semibold px-3 py-1.5 rounded-full text-xs sm:text-sm flex items-center space-x-1.5 transition shadow">
        <i class="fa-solid fa-rotate-left"></i>
        <span class="hidden sm:inline">Reset Pets</span>
      </button>
    </div>
  </header>

  <!-- Main Canvas Room Playground -->
  <main class="relative flex-1 w-full bg-cream overflow-hidden flex items-center justify-center">
    
    <!-- Status Overlay Cards -->
    <div class="absolute top-3 left-4 right-4 z-10 flex justify-between items-start pointer-events-none">
      
      <!-- Barnaby Dog Card -->
      <div class="bg-white/95 backdrop-blur border-2 border-mustard rounded-2xl p-2 sm:p-2.5 shadow-lg flex items-center space-x-2.5 pointer-events-auto min-w-[150px] sm:min-w-[190px]">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-mustard/20 border-2 border-mustard flex items-center justify-center text-lg sm:text-xl">
          🐶
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-0.5">
            <span class="font-display font-bold text-xs sm:text-sm text-indigo">Barnaby</span>
            <span id="dogStatus" class="text-[10px] font-bold text-terracotta bg-mustard/20 px-1.5 py-0.5 rounded-full">Roaming</span>
          </div>
          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden border border-slate-300">
            <div id="dogHappyBar" class="bg-mustard h-full transition-all duration-300 w-4/5"></div>
          </div>
        </div>
      </div>

      <!-- Action Notification Banner -->
      <div id="actionBanner" class="bg-indigo/90 text-white px-4 py-1.5 rounded-2xl shadow-xl border border-white/20 text-xs sm:text-sm font-medium flex items-center space-x-2 pointer-events-auto hidden md:flex">
        <i id="actionIcon" class="fa-solid fa-face-smile text-mustard"></i>
        <span id="actionText">Barnaby & Mimi are freely exploring the room!</span>
      </div>

      <!-- Mimi Cat Card -->
      <div class="bg-white/95 backdrop-blur border-2 border-terracotta rounded-2xl p-2 sm:p-2.5 shadow-lg flex items-center space-x-2.5 pointer-events-auto min-w-[150px] sm:min-w-[190px]">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-terracotta/20 border-2 border-terracotta flex items-center justify-center text-lg sm:text-xl">
          🐱
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-0.5">
            <span class="font-display font-bold text-xs sm:text-sm text-indigo">Mimi</span>
            <span id="catStatus" class="text-[10px] font-bold text-terracotta bg-terracotta/20 px-1.5 py-0.5 rounded-full">Exploring</span>
          </div>
          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden border border-slate-300">
            <div id="catHappyBar" class="bg-terracotta h-full transition-all duration-300 w-3/4"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- The 2.5D Canvas -->
    <canvas id="playgroundCanvas" class="w-full h-full cursor-crosshair block"></canvas>
  </main>

  <!-- Bottom Toys Toolbar -->
  <footer class="bg-indigo border-t-4 border-mustard p-3 z-20 shadow-2xl">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2.5">
      
      <!-- Dog Toys -->
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-center">
        <span class="font-display text-white text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-dog text-mustard"></i> Dog Toys:
        </span>
        <div class="flex space-x-1.5">
          <button data-toy="ball" class="toy-btn active-toy bg-white text-indigo border-2 border-mustard px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Ball
          </button>
          <button data-toy="bone" class="toy-btn bg-white text-indigo border-2 border-mustard px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Bone
          </button>
          <button data-toy="rope" class="toy-btn bg-white text-indigo border-2 border-mustard px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Tug Rope
          </button>
        </div>
      </div>

      <!-- Cat Toys -->
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-center">
        <span class="font-display text-white text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-cat text-terracotta"></i> Cat Toys:
        </span>
        <div class="flex space-x-1.5">
          <button data-toy="laser" class="toy-btn-cat bg-white text-indigo border-2 border-terracotta px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Laser
          </button>
          <button data-toy="wand" class="toy-btn-cat bg-white text-indigo border-2 border-terracotta px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Wand
          </button>
          <button data-toy="yarn" class="toy-btn-cat bg-white text-indigo border-2 border-terracotta px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Yarn
          </button>
          <button data-toy="mouse" class="toy-btn-cat bg-white text-indigo border-2 border-terracotta px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shadow">
            Mouse
          </button>
        </div>
      </div>

    </div>
  </footer>

  <script>
    /* Audio Synthesis Engine */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBark() {
        if (this.muted) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.15);
      }

      playMeow() {
        if (this.muted) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(780, now + 0.14);
        osc.frequency.linearRampToValueAtTime(420, now + 0.28);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.28);
      }

      playSqueak() {
        if (this.muted) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1300, now);
        osc.frequency.exponentialRampToValueAtTime(2100, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      }

      playBounce() {
        if (this.muted) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.1);
      }

      playPurr() {
        if (this.muted) return;
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(36, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    const soundEngine = new SoundEngine();

    /* Canvas Setup & Image Pattern Loading */
    const canvas = document.getElementById('playgroundCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0, wallY = 0;
    let topoPattern = null;

    // Load Floor Image Asset
    const floorImg = new Image();
    floorImg.src = 'assets/floor.jpg';
    floorImg.onload = () => {
      topoPattern = ctx.createPattern(floorImg, 'repeat');
    };

    function resizeCanvas() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width;
      canvas.height = height;
      wallY = height * 0.35;
      if (floorImg.complete && floorImg.naturalWidth > 0) {
        topoPattern = ctx.createPattern(floorImg, 'repeat');
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /* Game States */
    let activeToyType = 'ball';
    let dogHappiness = 85;
    let catHappiness = 80;

    const mousePos = { x: width / 2, y: height * 0.65, isDown: false };

    /* UI References */
    const dogHappyBar = document.getElementById('dogHappyBar');
    const catHappyBar = document.getElementById('catHappyBar');
    const dogStatus = document.getElementById('dogStatus');
    const catStatus = document.getElementById('catStatus');
    const actionText = document.getElementById('actionText');

    function updateBanner(text) {
      if (actionText) actionText.innerText = text;
    }

    /* Floating Particles */
    class Particle {
      constructor(x, y, z, symbol) {
        this.x = x; this.y = y; this.z = z;
        this.symbol = symbol;
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = (Math.random() - 0.5) * 2;
        this.vz = Math.random() * 2 + 2;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
      }
      update() {
        this.x += this.vx; this.y += this.vy; this.z += this.vz;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = '16px sans-serif';
        ctx.fillText(this.symbol, this.x, this.y - this.z);
        ctx.restore();
      }
    }
    const particles = [];
    function spawnParticles(x, y, z, symbol, count = 3) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, z, symbol));
      }
    }

    /* Toy Physics Object */
    class ToyItem {
      constructor(type, x, y) {
        this.type = type;
        this.x = x; this.y = y; this.z = 0;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 4;
        this.vz = 8;
        this.radius = 12;
        this.active = true;
        this.isHeld = false;
        this.trail = [];
      }

      update() {
        if (this.isHeld) return;

        // Mouse Toy skittering AI
        if (this.type === 'mouse' && this.active) {
          if (Math.random() < 0.08) {
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 6;
            soundEngine.playSqueak();
          }
        }

        // 3D Gravity & Floor Bounce
        this.vz -= 0.45;
        this.x += this.vx; this.y += this.vy; this.z += this.vz;
        this.vx *= 0.96; this.vy *= 0.96;

        if (this.z <= 0) {
          this.z = 0;
          if (Math.abs(this.vz) > 1.5) {
            this.vz = -this.vz * 0.5;
            soundEngine.playBounce();
          } else {
            this.vz = 0;
          }
        }

        // Room Bounds
        this.x = Math.max(40, Math.min(width - 40, this.x));
        this.y = Math.max(wallY + 20, Math.min(height - 40, this.y));

        if (this.type === 'yarn' && (Math.abs(this.vx) > 0.5 || Math.abs(this.vy) > 0.5)) {
          this.trail.push({ x: this.x, y: this.y - this.z });
          if (this.trail.length > 18) this.trail.shift();
        }
      }

      draw(ctx) {
        const scale = 0.7 + (this.y / height) * 0.5;
        ctx.save();
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 10 * scale, 5 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(this.x, this.y - this.z);
        ctx.scale(scale, scale);

        if (this.type === 'ball') {
          ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.fillStyle = '#CCFF00'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
        } else if (this.type === 'bone') {
          ctx.fillStyle = '#FFFDF9'; ctx.strokeStyle = '#C3684D'; ctx.lineWidth = 2;
          ctx.fillRect(-10, -4, 20, 8);
          ctx.beginPath();
          ctx.arc(-10, -4, 4, 0, Math.PI * 2); ctx.arc(-10, 4, 4, 0, Math.PI * 2);
          ctx.arc(10, -4, 4, 0, Math.PI * 2); ctx.arc(10, 4, 4, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        } else if (this.type === 'rope') {
          ctx.strokeStyle = '#FFB300'; ctx.lineWidth = 6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
          ctx.fillStyle = '#C3684D';
          ctx.beginPath(); ctx.arc(-12, 0, 5, 0, Math.PI*2); ctx.arc(12, 0, 5, 0, Math.PI*2); ctx.fill();
        } else if (this.type === 'yarn') {
          ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2);
          ctx.fillStyle = '#C3684D'; ctx.fill();
          ctx.lineWidth = 1.5; ctx.strokeStyle = '#313A70'; ctx.stroke();
        } else if (this.type === 'mouse') {
          ctx.fillStyle = '#98A1A6';
          ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#C3684D';
          ctx.beginPath(); ctx.arc(-3, -5, 3, 0, Math.PI * 2); ctx.arc(3, -5, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        if (this.type === 'yarn' && this.trail.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#C3684D'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let p of this.trail) ctx.lineTo(p.x, p.y);
          ctx.stroke(); ctx.restore();
        }
      }
    }

    let activeToyInstance = null;

    /* Barnaby the Golden Retriever */
    class Dog {
      constructor(x, y) {
        this.x = x; this.y = y; this.z = 0;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.facing = 1;
        this.state = 'ROAMING';
        this.target = { x: x, y: y };
        this.roamTimer = 0;
        this.animCycle = 0;
      }

      update() {
        this.animCycle += 0.2;

        if (activeToyInstance && ['ball', 'bone', 'rope'].includes(activeToyType)) {
          this.target.x = activeToyInstance.x;
          this.target.y = activeToyInstance.y;
          this.state = 'CHASING';
        } else if (this.state === 'CHASING' && !activeToyInstance) {
          this.state = 'ROAMING';
        }

        if (this.state === 'ROAMING') {
          this.roamTimer--;
          if (this.roamTimer <= 0) {
            this.target.x = Math.random() * (width - 120) + 60;
            this.target.y = Math.random() * (height - wallY - 80) + wallY + 40;
            this.roamTimer = Math.random() * 200 + 100;
          }
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 15) {
          this.facing = dx >= 0 ? 1 : -1;
          const speed = this.state === 'CHASING' ? 4.5 : 2.0;
          this.vx = (dx / dist) * speed;
          this.vy = (dy / dist) * speed;
          this.x += this.vx; this.y += this.vy;
        } else {
          this.vx = 0; this.vy = 0;
          if (this.state === 'CHASING' && activeToyInstance) {
            if (activeToyType === 'ball') {
              activeToyInstance.isHeld = true;
              this.state = 'FETCHING';
              this.target.x = width * 0.2; this.target.y = height * 0.6;
              soundEngine.playBark();
              updateBanner("Barnaby caught the ball!");
            } else if (activeToyType === 'bone') {
              soundEngine.playSqueak();
              dogHappiness = Math.min(100, dogHappiness + 8);
              spawnParticles(this.x, this.y, 25, '🦴', 2);
            }
          }
        }

        if (this.state === 'FETCHING') {
          if (activeToyInstance) {
            activeToyInstance.x = this.x + this.facing * 15;
            activeToyInstance.y = this.y;
            activeToyInstance.z = 12;
          }
          if (dist <= 15) {
            if (activeToyInstance) activeToyInstance.isHeld = false;
            this.state = 'ROAMING';
            dogHappiness = Math.min(100, dogHappiness + 10);
            soundEngine.playBark();
            spawnParticles(this.x, this.y, 20, '❤️', 3);
            updateBanner("Barnaby returned the ball!");
          }
        }

        dogStatus.innerText = this.state;
      }

      draw(ctx) {
        const scale = 0.7 + (this.y / height) * 0.5;
        const bounce = Math.abs(Math.sin(this.animCycle)) * (this.vx !== 0 ? 4 : 1);

        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 22 * scale, 10 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(this.x, this.y - this.z - bounce);
        ctx.scale(this.facing * scale, scale);

        ctx.fillStyle = '#FFB300';
        ctx.beginPath(); ctx.ellipse(0, -12, 22, 14, 0, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#C3684D'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-10, -4); ctx.lineTo(-10, 8);
        ctx.moveTo(10, -4); ctx.lineTo(10, 8);
        ctx.stroke();

        ctx.fillStyle = '#FFB300';
        ctx.beginPath(); ctx.ellipse(16, -22, 12, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FAF1E4';
        ctx.beginPath(); ctx.ellipse(22, -20, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3D3D3D';
        ctx.beginPath(); ctx.arc(26, -21, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(18, -24, 2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#313A70';
        ctx.beginPath(); ctx.ellipse(10, -20, 5, 10, 0.2, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }
    }

    /* Mimi the Tabby Cat */
    class Cat {
      constructor(x, y) {
        this.x = x; this.y = y; this.z = 0;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.facing = -1;
        this.state = 'EXPLORING';
        this.target = { x: x, y: y };
        this.roamTimer = 0;
        this.animCycle = 0;
      }

      update() {
        this.animCycle += 0.22;

        if (activeToyType === 'laser') {
          this.target.x = mousePos.x;
          this.target.y = mousePos.y;
          this.state = 'STALKING';
        } else if (activeToyInstance && ['wand', 'yarn', 'mouse'].includes(activeToyType)) {
          this.target.x = activeToyInstance.x;
          this.target.y = activeToyInstance.y;
          this.state = 'POUNCING';
        } else if (this.state !== 'EXPLORING') {
          this.state = 'EXPLORING';
        }

        if (this.state === 'EXPLORING') {
          this.roamTimer--;
          if (this.roamTimer <= 0) {
            this.target.x = Math.random() * (width - 120) + 60;
            this.target.y = Math.random() * (height - wallY - 80) + wallY + 40;
            this.roamTimer = Math.random() * 220 + 110;
          }
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 12) {
          this.facing = dx >= 0 ? 1 : -1;
          const speed = this.state === 'POUNCING' ? 5.0 : (this.state === 'STALKING' ? 3.2 : 1.8);
          this.vx = (dx / dist) * speed;
          this.vy = (dy / dist) * speed;
          this.x += this.vx; this.y += this.vy;

          if (this.state === 'POUNCING' && dist < 40 && this.z <= 0) {
            this.vz = 5; soundEngine.playMeow();
          }
        } else {
          this.vx = 0; this.vy = 0;
          if (this.state === 'STALKING') {
            soundEngine.playPurr();
            catHappiness = Math.min(100, catHappiness + 0.2);
          }
        }

        if (this.z > 0 || this.vz !== 0) {
          this.vz -= 0.45;
          this.z += this.vz;
          if (this.z <= 0) {
            this.z = 0; this.vz = 0;
            if (activeToyInstance) {
              catHappiness = Math.min(100, catHappiness + 6);
              spawnParticles(this.x, this.y, 20, '🐾', 2);
            }
          }
        }

        catStatus.innerText = this.state;
      }

      draw(ctx) {
        const scale = 0.7 + (this.y / height) * 0.5;
        const bounce = Math.abs(Math.sin(this.animCycle)) * (this.vx !== 0 ? 3 : 0.5);

        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 16 * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(this.x, this.y - this.z - bounce);
        ctx.scale(this.facing * scale, scale);

        ctx.fillStyle = '#C3684D';
        ctx.beginPath(); ctx.ellipse(0, -10, 16, 11, 0, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.ellipse(12, -18, 9, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8, -23); ctx.lineTo(12, -30); ctx.lineTo(15, -23); ctx.fill();
        ctx.beginPath(); ctx.moveTo(13, -23); ctx.lineTo(17, -30); ctx.lineTo(20, -23); ctx.fill();

        ctx.fillStyle = '#AFE2CF';
        ctx.beginPath(); ctx.arc(14, -19, 2, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#C3684D'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-14, -8); ctx.quadraticCurveTo(-22, -18, -18, -24); ctx.stroke();

        ctx.restore();
      }
    }

    /* Instantiate Game World */
    const dog = new Dog(width * 0.35, height * 0.65);
    const cat = new Cat(width * 0.65, height * 0.70);

    /* Main Render Loop */
    function render() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Wall
      ctx.fillStyle = '#FAF1E4';
      ctx.fillRect(0, 0, width, wallY);

      // Wall Baseboard
      ctx.fillStyle = '#C3684D';
      ctx.fillRect(0, wallY - 12, width, 12);
      ctx.fillStyle = '#313A70';
      ctx.fillRect(0, wallY - 14, width, 2);

      // 2. Draw Tiled Floor Image (or fallback tan while loading)
      if (topoPattern) {
        ctx.fillStyle = topoPattern;
        ctx.fillRect(0, wallY, width, height - wallY);
      } else {
        ctx.fillStyle = '#E2C394';
        ctx.fillRect(0, wallY, width, height - wallY);
      }

      // Room Rug
      ctx.save();
      ctx.fillStyle = '#AFE2CF';
      ctx.beginPath();
      ctx.ellipse(width * 0.5, height * 0.68, width * 0.24, height * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = '#313A70'; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = '#FFB300'; ctx.stroke();
      ctx.restore();

      // Dog Bed & Cat Post
      ctx.save();
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#C3684D'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(width * 0.18, height * 0.52, 38, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      
      // Cat Scratching Post
      ctx.fillStyle = '#AFE2CF'; ctx.fillRect(width * 0.82 - 20, height * 0.52, 40, 6);
      ctx.fillStyle = '#A88456'; ctx.fillRect(width * 0.82 - 5, height * 0.38, 10, 70);
      ctx.restore();

      // Laser Pointer Red Dot
      if (activeToyType === 'laser') {
        ctx.save();
        ctx.fillStyle = '#FF0000';
        ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // 3. Update & Draw Toys + Pets with Depth Y-Sorting
      if (activeToyInstance) activeToyInstance.update();
      dog.update();
      cat.update();

      const entities = [dog, cat];
      if (activeToyInstance && activeToyType !== 'laser') entities.push(activeToyInstance);

      entities.sort((a, b) => a.y - b.y);

      entities.forEach(ent => ent.draw(ctx));

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // Happiness Decay & Bar Sync
      dogHappiness = Math.max(10, dogHappiness - 0.01);
      catHappiness = Math.max(10, catHappiness - 0.01);
      dogHappyBar.style.width = `${dogHappiness}%`;
      catHappyBar.style.width = `${catHappiness}%`;

      requestAnimationFrame(render);
    }

    /* Event Listeners */
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      mousePos.x = x; mousePos.y = y; mousePos.isDown = true;

      if (y > wallY) {
        if (activeToyType !== 'laser') {
          activeToyInstance = new ToyItem(activeToyType, x, y);
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    window.addEventListener('pointerup', () => mousePos.isDown = false);

    // Toy Toolbar Buttons
    document.querySelectorAll('.toy-btn, .toy-btn-cat').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.toy-btn, .toy-btn-cat').forEach(b => b.classList.remove('active-toy'));
        e.currentTarget.classList.add('active-toy');
        activeToyType = e.currentTarget.dataset.toy;
        activeToyInstance = null;
        updateBanner(`Selected ${activeToyType.toUpperCase()}! Click on the floor to play.`);
      });
    });

    // Header Controls
    document.getElementById('soundToggle').addEventListener('click', () => {
      soundEngine.muted = !soundEngine.muted;
      document.getElementById('soundIcon').className = soundEngine.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
      document.getElementById('soundLabel').innerText = soundEngine.muted ? 'Sound: OFF' : 'Sound: ON';
    });

    document.getElementById('resetPetsBtn').addEventListener('click', () => {
      dog.x = width * 0.35; dog.y = height * 0.65;
      cat.x = width * 0.65; cat.y = height * 0.70;
      activeToyInstance = null;
      updateBanner("Reset pet positions in the room!");
    });

    // Start App
    render();
  </script>
</body>
</html>
