<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMatch | Rescue Memory Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container container-easy" id="gameContainer">
    <span class="brand-badge">PetMatch Campaign</span>
    <h1 class="title">Find Their Forever Match 🐾</h1>
    <p class="subtitle">Flip cards to match shelter animals and their favorite toys!</p>

    <!-- Difficulty Level Selector -->
    <div class="difficulty-bar">
      <button class="diff-btn active" data-level="easy">Easy (3x4)</button>
      <button class="diff-btn" data-level="medium">Medium (4x4)</button>
      <button class="diff-btn" data-level="hard">Hard (5x6)</button>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Matches</span>
        <span class="stat-value" id="matches">0 / 6</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Flips</span>
        <span class="stat-value" id="flips">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>
    </div>

    <div class="game-board mode-easy" id="gameBoard"></div>

    <button class="btn-reset" id="resetBtn">Restart Game</button>

    <!-- Completion Modal -->
    <div class="modal-overlay" id="winModal">
      <div class="modal-icon">🏡❤️</div>
      <h2 class="modal-title">Every Pet Found a Match!</h2>
      <p class="modal-text" id="winStatsText">You matched all pets!</p>
      <a href="#quiz" class="modal-btn" id="modalQuizBtn">Take the "Which Pet Is Right for You?" Quiz</a>
      <button class="btn-reset" id="modalPlayAgainBtn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
