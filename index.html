<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMatch: Playtime Playground</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter & Fredoka Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: '#313A70',
            mustard: '#FFB300',
            rose: '#C9888F',
            mint: '#AFE2CF',
            terracotta: '#C3684D',
            charcoal: '#3D3D3D',
            cream: '#FBF7F1',
            grey: '#98A1A6'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Fredoka', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #313A70;
      font-family: 'Inter', sans-serif;
      user-select: none;
      touch-action: manipulation;
    }
    .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    canvas {
      touch-action: none;
    }
    /* Custom scrollbar for control drawers */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #C3684D;
      border-radius: 10px;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between text-charcoal bg-indigo overflow-hidden">

  <!-- Header Bar -->
  <header class="bg-cream/95 backdrop-blur border-b-4 border-mustard px-4 py-2.5 sm:px-6 flex justify-between items-center shadow-lg z-20">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-terracotta flex items-center justify-center text-white text-xl font-bold shadow-md">
        <i class="fa-solid fa-paw"></i>
      </div>
      <div>
        <h1 class="font-display font-bold text-lg sm:text-xl text-indigo leading-tight">PetMatch Playground</h1>
        <p class="text-xs text-terracotta font-semibold hidden sm:block">Interactive Rescue Animal Play Session</p>
      </div>
    </div>

    <!-- Status & Sound Toggle -->
    <div class="flex items-center space-x-3">
      <button id="soundToggle" class="bg-mint hover:bg-opacity-80 text-indigo font-semibold px-3 py-1.5 rounded-full text-xs sm:text-sm flex items-center space-x-2 transition shadow">
        <i id="soundIcon" class="fa-solid fa-volume-high text-base"></i>
        <span id="soundLabel" class="hidden sm:inline">Sound: ON</span>
      </button>

      <button id="resetRoomBtn" class="bg-rose hover:bg-opacity-90 text-white font-semibold px-3 py-1.5 rounded-full text-xs sm:text-sm flex items-center space-x-1.5 transition shadow">
        <i class="fa-solid fa-rotate-left"></i>
        <span class="hidden sm:inline">Reset Room</span>
      </button>
    </div>
  </header>

  <!-- Main Game Canvas Container -->
  <main class="relative flex-1 w-full bg-cream overflow-hidden flex flex-col items-center justify-center">
    
    <!-- Top Floating Status Overlay -->
    <div class="absolute top-4 left-4 right-4 z-10 flex flex-wrap gap-3 justify-between pointer-events-none">
      
      <!-- Dog Happiness Card -->
      <div class="bg-white/90 backdrop-blur border-2 border-mustard rounded-2xl p-2.5 sm:p-3 shadow-lg flex items-center space-x-3 pointer-events-auto min-w-[160px] sm:min-w-[200px]">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-mustard/20 border-2 border-mustard flex items-center justify-center text-xl sm:text-2xl text-terracotta">
          🐶
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-1">
            <span class="font-display font-bold text-xs sm:text-sm text-indigo">Barnaby (Dog)</span>
            <span id="dogMoodText" class="text-[10px] sm:text-xs font-semibold text-terracotta">Eager</span>
          </div>
          <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden border border-slate-300">
            <div id="dogHappyBar" class="bg-mustard h-full transition-all duration-300 w-3/4"></div>
          </div>
        </div>
      </div>

      <!-- Center Dynamic Speech Bubble -->
      <div id="speechBubble" class="hidden sm:flex bg-indigo text-white px-4 py-2 rounded-2xl shadow-xl border-2 border-mint text-xs sm:text-sm font-medium items-center space-x-2 max-w-xs transition-all transform scale-100 opacity-100">
        <i class="fa-solid fa-comment-dots text-mustard text-base"></i>
        <span id="speechText">Click toys to toss them into the room!</span>
      </div>

      <!-- Cat Happiness Card -->
      <div class="bg-white/90 backdrop-blur border-2 border-rose rounded-2xl p-2.5 sm:p-3 shadow-lg flex items-center space-x-3 pointer-events-auto min-w-[160px] sm:min-w-[200px]">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-rose/20 border-2 border-rose flex items-center justify-center text-xl sm:text-2xl text-rose">
          🐱
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-1">
            <span class="font-display font-bold text-xs sm:text-sm text-indigo">Mimi (Cat)</span>
            <span id="catMoodText" class="text-[10px] sm:text-xs font-semibold text-rose">Curious</span>
          </div>
          <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden border border-slate-300">
            <div id="catHappyBar" class="bg-rose h-full transition-all duration-300 w-2/3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- The Play Area Canvas -->
    <canvas id="gameCanvas" class="w-full h-full cursor-grab active:cursor-grabbing block"></canvas>

    <!-- On-screen Click Tip overlay -->
    <div class="absolute bottom-3 text-center text-xs text-charcoal/70 bg-cream/80 backdrop-blur px-3 py-1 rounded-full pointer-events-none border border-terracotta/20">
      <i class="fa-solid fa-hand-pointer text-terracotta mr-1"></i> Click anywhere in the room to toss active toy or drag items!
    </div>
  </main>

  <!-- Bottom Control Deck / Toy Selector -->
  <footer class="bg-indigo border-t-4 border-terracotta p-3 sm:p-4 z-20 shadow-2xl">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
      
      <!-- Dog Toys Section -->
      <div class="flex items-center space-x-2 w-full md:w-auto justify-center">
        <span class="font-display text-white text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-dog text-mustard"></i> Dog Toys:
        </span>
        <div class="flex space-x-2">
          <button data-toy="ball" class="toy-btn active-toy bg-cream text-indigo hover:bg-mustard border-2 border-mustard px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition transform hover:-translate-y-0.5 shadow">
            <span>🎾 Ball</span>
          </button>
          <button data-toy="bone" class="toy-btn bg-cream text-indigo hover:bg-mustard border-2 border-mustard px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition transform hover:-translate-y-0.5 shadow">
            <span>🦴 Bone</span>
          </button>
          <button data-toy="ring" class="toy-btn bg-cream text-indigo hover:bg-mustard border-2 border-mustard px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition transform hover:-translate-y-0.5 shadow">
            <span>⭕ Chew Ring</span>
          </button>
        </div>
      </div>

      <!-- Action Callout Button -->
      <div class="hidden lg:block text-center">
        <button id="praiseBtn" class="bg-mustard hover:bg-yellow-400 text-indigo font-display font-bold px-4 py-1.5 rounded-full text-xs shadow-md border-2 border-white transition transform active:scale-95">
          👏 Call Both Pets!
        </button>
      </div>

      <!-- Cat Toys Section -->
      <div class="flex items-center space-x-2 w-full md:w-auto justify-center">
        <span class="font-display text-white text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-cat text-rose"></i> Cat Toys:
        </span>
        <div class="flex space-x-2">
          <button data-toy="yarn" class="toy-btn bg-cream text-indigo hover:bg-rose hover:text-white border-2 border-rose px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition transform hover:-translate-y-0.5 shadow">
            <span>🧶 Yarn</span>
          </button>
          <button data-toy="wand" class="toy-btn bg-cream text-indigo hover:bg-rose hover:text-white border-2 border-rose px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition transform hover:-translate-y-0.5 shadow">
            <span>🪶 Wand</span>
          </button>
          <button data-toy="mouse" class="toy-btn bg-cream text-indigo hover:bg-rose hover:text-white border-2 border-rose px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition transform hover:-translate-y-0.5 shadow">
            <span>🐭 Mouse</span>
          </button>
        </div>
      </div>

    </div>
  </footer>

  <script>
    /* ========================================================================
     * WEB AUDIO SYNTHESIZER (No external audio files needed)
     * ======================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBark() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
      }

      playMeow() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(700, now + 0.15);
        osc.frequency.linearRampToValueAtTime(350, now + 0.35);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      }

      playSqueak() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      playBounce() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      playPurr() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(30, now);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const soundEngine = new SoundEngine();

    /* ========================================================================
     * GAME INITIALIZATION & CANVAS RESIZING
     * ======================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let groundY = 0;

    function resizeCanvas() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width;
      canvas.height = height;
      groundY = height * 0.78; // Floor level
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Selected toy type to spawn on click
    let selectedToyType = 'ball';

    // UI elements
    const dogHappyBar = document.getElementById('dogHappyBar');
    const catHappyBar = document.getElementById('catHappyBar');
    const dogMoodText = document.getElementById('dogMoodText');
    const catMoodText = document.getElementById('catMoodText');
    const speechBubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');

    let dogHappiness = 75;
    let catHappiness = 65;

    function showSpeech(text) {
      speechText.innerText = text;
      speechBubble.classList.remove('opacity-0', 'scale-90');
      speechBubble.classList.add('opacity-100', 'scale-100');
    }

    // Particle Effect Class
    class Particle {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'heart', 'star', 'sparkle', 'string'
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = -Math.random() * 2 - 1;
        this.alpha = 1.0;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 10 + 12;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        this.life -= this.decay;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = `${this.size}px sans-serif`;
        if (this.type === 'heart') ctx.fillText('❤️', this.x, this.y);
        else if (this.type === 'star') ctx.fillText('⭐', this.x, this.y);
        else if (this.type === 'paw') ctx.fillText('🐾', this.x, this.y);
        else if (this.type === 'music') ctx.fillText('🎵', this.x, this.y);
        ctx.restore();
      }
    }

    const particles = [];

    function spawnParticles(x, y, type = 'heart', count = 3) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, type));
      }
    }

    /* ========================================================================
     * TOY CLASS (Ball, Bone, Ring, Yarn, Wand, Mouse)
     * ======================================================================== */
    class Toy {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = -Math.random() * 6 - 2;
        this.radius = 16;
        this.isHeldBy = null; // 'dog' or 'cat'
        this.rotation = 0;
        this.vRot = (Math.random() - 0.5) * 0.2;
        this.trail = [];
        this.activeWandAngle = 0;
      }

      update() {
        if (this.isHeldBy) return;

        // Apply Gravity
        this.vy += 0.35;

        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.vRot;

        // Friction
        this.vx *= 0.98;

        // Ground Collision
        if (this.y + this.radius >= groundY) {
          this.y = groundY - this.radius;
          if (Math.abs(this.vy) > 1) {
            this.vy = -this.vy * 0.55;
            soundEngine.playBounce();
          } else {
            this.vy = 0;
          }
          this.vx *= 0.9;
          this.vRot *= 0.8;
        }

        // Wall Collision
        if (this.x - this.radius <= 20) {
          this.x = 20 + this.radius;
          this.vx = -this.vx * 0.6;
        } else if (this.x + this.radius >= width - 20) {
          this.x = width - 20 - this.radius;
          this.vx = -this.vx * 0.6;
        }

        // Mouse behavior (autonomous skittering if on ground)
        if (this.type === 'mouse' && Math.abs(this.vy) < 0.1 && this.y >= groundY - this.radius - 2) {
          if (Math.random() < 0.03) {
            this.vx = (Math.random() - 0.5) * 10;
            soundEngine.playSqueak();
          }
        }

        // Yarn thread trail
        if (this.type === 'yarn' && (Math.abs(this.vx) > 0.5 || Math.abs(this.vy) > 0.5)) {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 25) this.trail.shift();
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.type === 'ball') {
          // Tennis Ball
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fillStyle = '#CCFF00';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#FFFFFF';
          ctx.stroke();

          // Curved seam
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0.5, 2.5);
          ctx.stroke();

        } else if (this.type === 'bone') {
          // Dog Bone
          ctx.fillStyle = '#FBF7F1';
          ctx.strokeStyle = '#C9888F';
          ctx.lineWidth = 2;

          ctx.fillRect(-12, -4, 24, 8);
          // 4 bone end circles
          ctx.beginPath();
          ctx.arc(-12, -5, 5, 0, Math.PI * 2);
          ctx.arc(-12, 5, 5, 0, Math.PI * 2);
          ctx.arc(12, -5, 5, 0, Math.PI * 2);
          ctx.arc(12, 5, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

        } else if (this.type === 'ring') {
          // Chew Ring
          ctx.beginPath();
          ctx.arc(0, 0, 16, 0, Math.PI * 2);
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#FFB300';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#313A70';
          ctx.stroke();

        } else if (this.type === 'yarn') {
          // Yarn Ball
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fillStyle = '#C9888F';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#313A70';
          ctx.stroke();

          // Texture lines
          ctx.beginPath();
          ctx.arc(-2, -2, 10, 0, Math.PI);
          ctx.arc(2, 2, 8, 1, Math.PI * 1.5);
          ctx.strokeStyle = 'rgba(255,255,255,0.6)';
          ctx.stroke();

        } else if (this.type === 'wand') {
          // Feather Wand
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#C3684D';
          ctx.beginPath();
          ctx.moveTo(-15, 15);
          ctx.lineTo(10, -10);
          ctx.stroke();

          // Feathers at top
          ctx.fillStyle = '#AFE2CF';
          ctx.beginPath();
          ctx.ellipse(12, -12, 8, 4, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FFB300';
          ctx.beginPath();
          ctx.ellipse(15, -8, 6, 3, Math.PI / 3, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.type === 'mouse') {
          // Toy Mouse
          ctx.fillStyle = '#98A1A6';
          ctx.beginPath();
          ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
          ctx.fill();

          // Ears
          ctx.fillStyle = '#C9888F';
          ctx.beginPath();
          ctx.arc(-4, -6, 4, 0, Math.PI * 2);
          ctx.arc(4, -6, 4, 0, Math.PI * 2);
          ctx.fill();

          // Tail
          ctx.strokeStyle = '#C9888F';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-12, 0);
          ctx.quadraticCurveTo(-18, -6, -22, -2);
          ctx.stroke();
        }

        ctx.restore();

        // Render yarn thread behind ball
        if (this.type === 'yarn' && this.trail.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#C9888F';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) {
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
          }
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    const toys = [];

    /* ========================================================================
     * PET CLASS (Dog & Cat Animated Characters)
     * ======================================================================== */
    class Pet {
      constructor(species, x, colorPalette) {
        this.species = species; // 'dog' or 'cat'
        this.x = x;
        this.y = groundY - 20;
        this.vx = 0;
        this.vy = 0;
        this.facing = 1; // 1 = right, -1 = left
        this.state = 'idle'; // 'idle', 'chasing', 'playing', 'pouncing'
        this.palette = colorPalette;
        this.targetToy = null;
        this.heldToy = null;
        this.playTimer = 0;
        this.walkCycle = 0;
        this.tailWag = 0;
        this.earFlick = 0;
      }

      update() {
        this.walkCycle += 0.15;
        this.tailWag += 0.2;

        // Gravity check
        if (this.y < groundY - 20) {
          this.vy += 0.4;
        } else {
          this.y = groundY - 20;
          this.vy = 0;
        }

        this.y += this.vy;

        // State Machine logic
        if (this.state === 'idle') {
          this.vx = 0;

          // Search for relevant target toy in room
          const preferredTypes = this.species === 'dog' 
            ? ['ball', 'bone', 'ring'] 
            : ['yarn', 'wand', 'mouse'];

          const availableToys = toys.filter(t => preferredTypes.includes(t.type) && !t.isHeldBy);

          if (availableToys.length > 0) {
            // Pick closest toy
            availableToys.sort((a, b) => Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y));
            this.targetToy = availableToys[0];
            this.state = 'chasing';
            
            if (this.species === 'dog') {
              soundEngine.playBark();
              showSpeech("Barnaby spotted a toy!");
            } else {
              soundEngine.playMeow();
              showSpeech("Mimi is sneaking closer...");
            }
          }

        } else if (this.state === 'chasing') {
          if (!this.targetToy || this.targetToy.isHeldBy || !toys.includes(this.targetToy)) {
            this.state = 'idle';
            this.targetToy = null;
            return;
          }

          const dx = this.targetToy.x - this.x;
          this.facing = dx >= 0 ? 1 : -1;

          const speed = this.species === 'dog' ? 3.8 : 4.2;
          if (Math.abs(dx) > 25) {
            this.vx = this.facing * speed;
            this.x += this.vx;
          } else {
            // Reached toy!
            if (this.species === 'cat' && Math.random() < 0.5) {
              // Cat Pounce action!
              this.vy = -5;
              this.state = 'pouncing';
            } else {
              this.grabToy();
            }
          }

        } else if (this.state === 'pouncing') {
          this.x += this.facing * 2;
          if (this.y >= groundY - 20) {
            this.grabToy();
          }

        } else if (this.state === 'playing') {
          this.vx = 0;
          this.playTimer--;

          // Play effects
          if (this.playTimer % 15 === 0) {
            spawnParticles(this.x, this.y - 30, 'heart', 1);
            if (this.species === 'dog') {
              dogHappiness = Math.min(100, dogHappiness + 4);
              soundEngine.playSqueak();
            } else {
              catHappiness = Math.min(100, catHappiness + 4);
              soundEngine.playPurr();
            }
          }

          if (this.playTimer <= 0) {
            this.releaseToy();
            this.state = 'idle';
          }
        }

        // Keep inside screen bounds
        this.x = Math.max(40, Math.min(width - 40, this.x));

        // Sync held toy position
        if (this.heldToy) {
          this.heldToy.x = this.x + (this.facing * 18);
          this.heldToy.y = this.y - 10;
        }
      }

      grabToy() {
        if (this.targetToy && !this.targetToy.isHeldBy) {
          this.heldToy = this.targetToy;
          this.heldToy.isHeldBy = this.species;
          this.state = 'playing';
          this.playTimer = 100 + Math.floor(Math.random() * 60);

          if (this.species === 'dog') {
            dogHappiness = Math.min(100, dogHappiness + 10);
            showSpeech("Barnaby loves playing!");
          } else {
            catHappiness = Math.min(100, catHappiness + 10);
            showSpeech("Mimi caught the toy!");
          }
        }
      }

      releaseToy() {
        if (this.heldToy) {
          this.heldToy.isHeldBy = null;
          this.heldToy.vx = this.facing * (Math.random() * 4 + 2);
          this.heldToy.vy = -Math.random() * 4 - 2;
          this.heldToy = null;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.facing, 1);

        const isMoving = Math.abs(this.vx) > 0.2;
        const legOffset = isMoving ? Math.sin(this.walkCycle) * 8 : 0;
        const tailAngle = Math.sin(this.tailWag) * (this.state === 'playing' ? 0.4 : 0.2);

        if (this.species === 'dog') {
          // --- DRAW DOG (Golden Retriever / Mustard) ---
          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.beginPath();
          ctx.ellipse(0, 15, 26, 8, 0, 0, Math.PI * 2);
          ctx.fill();

          // Tail
          ctx.save();
          ctx.translate(-22, -10);
          ctx.rotate(-0.5 + tailAngle);
          ctx.strokeStyle = this.palette.body;
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-15, -10, -20, -5);
          ctx.stroke();
          ctx.restore();

          // Legs
          ctx.strokeStyle = this.palette.bodyDark;
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';

          ctx.beginPath();
          // Back legs
          ctx.moveTo(-12, 0); ctx.lineTo(-12 + legOffset, 15);
          ctx.moveTo(12, 0); ctx.lineTo(12 - legOffset, 15);
          // Front legs
          ctx.moveTo(-6, 0); ctx.lineTo(-6 - legOffset, 15);
          ctx.moveTo(18, 0); ctx.lineTo(18 + legOffset, 15);
          ctx.stroke();

          // Body
          ctx.fillStyle = this.palette.body;
          ctx.beginPath();
          ctx.ellipse(0, -5, 24, 16, 0, 0, Math.PI * 2);
          ctx.fill();

          // Head
          ctx.beginPath();
          ctx.ellipse(18, -20, 14, 12, 0, 0, Math.PI * 2);
          ctx.fill();

          // Snout
          ctx.fillStyle = '#FFFDF9';
          ctx.beginPath();
          ctx.ellipse(25, -17, 8, 6, 0, 0, Math.PI * 2);
          ctx.fill();

          // Nose
          ctx.fillStyle = '#3D3D3D';
          ctx.beginPath();
          ctx.arc(30, -19, 3, 0, Math.PI * 2);
          ctx.fill();

          // Floppy Ear
          ctx.fillStyle = this.palette.accent;
          ctx.beginPath();
          ctx.ellipse(12, -18 + Math.sin(this.walkCycle) * 2, 6, 12, 0.3, 0, Math.PI * 2);
          ctx.fill();

          // Eye
          ctx.fillStyle = '#3D3D3D';
          ctx.beginPath();
          ctx.arc(20, -22, 2.5, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // --- DRAW CAT (Tabby / Rose-Terracotta) ---
          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.beginPath();
          ctx.ellipse(0, 15, 20, 6, 0, 0, Math.PI * 2);
          ctx.fill();

          // Tail
          ctx.save();
          ctx.translate(-16, -8);
          ctx.rotate(-0.8 + tailAngle * 1.5);
          ctx.strokeStyle = this.palette.bodyDark;
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-10, -20, -5, -30);
          ctx.stroke();
          ctx.restore();

          // Legs
          ctx.strokeStyle = this.palette.bodyDark;
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';

          ctx.beginPath();
          ctx.moveTo(-10, 0); ctx.lineTo(-10 + legOffset, 15);
          ctx.moveTo(10, 0); ctx.lineTo(10 - legOffset, 15);
          ctx.moveTo(-4, 0); ctx.lineTo(-4 - legOffset, 15);
          ctx.moveTo(14, 0); ctx.lineTo(14 + legOffset, 15);
          ctx.stroke();

          // Body
          ctx.fillStyle = this.palette.body;
          ctx.beginPath();
          ctx.ellipse(0, -4, 18, 13, 0, 0, Math.PI * 2);
          ctx.fill();

          // Head
          ctx.beginPath();
          ctx.arc(14, -18, 11, 0, Math.PI * 2);
          ctx.fill();

          // Pointy Ears
          ctx.fillStyle = this.palette.accent;
          ctx.beginPath();
          ctx.moveTo(8, -24); ctx.lineTo(12, -32); ctx.lineTo(16, -24); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(16, -24); ctx.lineTo(20, -32); ctx.lineTo(22, -22); ctx.fill();

          // Cat Eyes (Slight almond green)
          ctx.fillStyle = '#AFE2CF';
          ctx.beginPath();
          ctx.ellipse(18, -19, 3, 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#3D3D3D';
          ctx.beginPath();
          ctx.arc(18, -19, 1, 0, Math.PI * 2);
          ctx.fill();

          // Cute Nose & Whiskers
          ctx.fillStyle = '#C9888F';
          ctx.beginPath();
          ctx.arc(23, -16, 1.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#3D3D3D';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(22, -15); ctx.lineTo(28, -17);
          ctx.moveTo(22, -14); ctx.lineTo(28, -13);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // Instantiating Dog and Cat
    const dog = new Pet('dog', width * 0.3, { body: '#FFB300', bodyDark: '#C3684D', accent: '#313A70' });
    const cat = new Pet('cat', width * 0.7, { body: '#C9888F', bodyDark: '#C3684D', accent: '#AFE2CF' });

    // Seed room with initial toys
    toys.push(new Toy(width * 0.4, groundY - 50, 'ball'));
    toys.push(new Toy(width * 0.6, groundY - 50, 'yarn'));

    /* ========================================================================
     * SCENE RENDERING ENGINE
     * ======================================================================== */
    function drawRoomBackground() {
      // Cozy Wall Background (Deep Cream/Warm Tone)
      ctx.fillStyle = '#FBF7F1';
      ctx.fillRect(0, 0, width, height);

      // Decorative Wallpaper Stripes
      ctx.fillStyle = 'rgba(201, 136, 143, 0.05)';
      for (let x = 0; x < width; x += 40) {
        ctx.fillRect(x, 0, 20, groundY);
      }

      // Baseboard Trim
      ctx.fillStyle = '#313A70';
      ctx.fillRect(0, groundY - 12, width, 12);

      // Wooden Floor
      const floorGradient = ctx.createLinearGradient(0, groundY, 0, height);
      floorGradient.addColorStop(0, '#EAD7C3');
      floorGradient.addColorStop(1, '#D8BC9D');
      ctx.fillStyle = floorGradient;
      ctx.fillRect(0, groundY, width, height - groundY);

      // Floor Wood Planks
      ctx.strokeStyle = 'rgba(49, 58, 112, 0.1)';
      ctx.lineWidth = 2;
      for (let y = groundY + 25; y < height; y += 25) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Cozy Oval Rug in Center
      ctx.fillStyle = 'rgba(175, 226, 207, 0.4)';
      ctx.strokeStyle = '#AFE2CF';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(width / 2, groundY + 25, width * 0.35, 30, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Window in Background
      ctx.save();
      const winX = width * 0.8;
      const winY = height * 0.15;
      ctx.fillStyle = '#AFE2CF';
      ctx.fillRect(winX - 40, winY, 80, 100);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#313A70';
      ctx.strokeRect(winX - 40, winY, 80, 100);
      // Window panes
      ctx.beginPath();
      ctx.moveTo(winX, winY); ctx.lineTo(winX, winY + 100);
      ctx.moveTo(winX - 40, winY + 50); ctx.lineTo(winX + 40, winY + 50);
      ctx.stroke();
      ctx.restore();
    }

    /* ========================================================================
     * MAIN GAME ANIMATION LOOP
     * ======================================================================== */
    function gameLoop() {
      // Clear & Draw Environment
      ctx.clearRect(0, 0, width, height);
      drawRoomBackground();

      // Update & Draw Toys
      for (let i = toys.length - 1; i >= 0; i--) {
        toys[i].update();
        toys[i].draw(ctx);
      }

      // Update & Draw Pets
      dog.update();
      dog.draw(ctx);

      cat.update();
      cat.draw(ctx);

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // Update UI Meters
      dogHappyBar.style.width = `${dogHappiness}%`;
      catHappyBar.style.width = `${catHappiness}%`;

      // Dynamic Mood labels
      dogMoodText.innerText = dogHappiness > 80 ? 'Ecstatic! 🐾' : dogHappiness > 50 ? 'Happy 😊' : 'Bored 💤';
      catMoodText.innerText = catHappiness > 80 ? 'Purring! 💖' : catHappiness > 50 ? 'Curious 😺' : 'Napping 😴';

      // Slowly decay happiness to encourage continuous play
      dogHappiness = Math.max(10, dogHappiness - 0.015);
      catHappiness = Math.max(10, catHappiness - 0.015);

      requestAnimationFrame(gameLoop);
    }

    /* ========================================================================
     * USER INPUT & INTERACTION HANDLERS
     * ======================================================================== */
    function spawnSelectedToy(x, y) {
      if (toys.length >= 8) toys.shift(); // Limit max toys to maintain performance

      const newToy = new Toy(x, y, selectedToyType);
      toys.push(newToy);

      soundEngine.playBounce();
      spawnParticles(x, y, 'star', 3);

      const toyNames = {
        ball: 'Tennis Ball',
        bone: 'Squeaky Bone',
        ring: 'Chew Ring',
        yarn: 'Yarn Ball',
        wand: 'Feather Wand',
        mouse: 'Play Mouse'
      };

      showSpeech(`Tossed a ${toyNames[selectedToyType]}!`);
    }

    // Canvas click/touch event
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Check if clicking existing toy to toss it
      let clickedToy = false;
      for (let toy of toys) {
        if (Math.hypot(toy.x - clickX, toy.y - clickY) < 30) {
          toy.vx = (Math.random() - 0.5) * 12;
          toy.vy = -Math.random() * 8 - 4;
          soundEngine.playSqueak();
          spawnParticles(toy.x, toy.y, 'paw', 2);
          clickedToy = true;
          break;
        }
      }

      if (!clickedToy) {
        spawnSelectedToy(clickX, clickY);
      }
    });

    // Toy selection buttons
    document.querySelectorAll('.toy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.toy-btn').forEach(b => b.classList.remove('active-toy', 'bg-mustard', 'bg-rose', 'text-white'));
        
        selectedToyType = btn.dataset.toy;
        btn.classList.add('active-toy', 'bg-mustard');
      });
    });

    // Praise button
    document.getElementById('praiseBtn').addEventListener('click', () => {
      soundEngine.playBark();
      soundEngine.playMeow();
      spawnParticles(dog.x, dog.y - 30, 'heart', 4);
      spawnParticles(cat.x, cat.y - 30, 'heart', 4);
      dogHappiness = Math.min(100, dogHappiness + 15);
      catHappiness = Math.min(100, catHappiness + 15);
      showSpeech("Both Barnaby and Mimi love the attention!");
    });

    // Sound Mute Toggle
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');

    soundToggle.addEventListener('click', () => {
      soundEngine.muted = !soundEngine.muted;
      if (soundEngine.muted) {
        soundIcon.className = 'fa-solid fa-volume-xmark text-base';
        soundLabel.innerText = 'Sound: OFF';
      } else {
        soundIcon.className = 'fa-solid fa-volume-high text-base';
        soundLabel.innerText = 'Sound: ON';
        soundEngine.playSqueak();
      }
    });

    // Reset Room Button
    document.getElementById('resetRoomBtn').addEventListener('click', () => {
      toys.length = 0;
      dog.x = width * 0.3;
      cat.x = width * 0.7;
      dog.state = 'idle';
      cat.state = 'idle';
      dogHappiness = 75;
      catHappiness = 65;
      toys.push(new Toy(width * 0.4, groundY - 50, 'ball'));
      toys.push(new Toy(width * 0.6, groundY - 50, 'yarn'));
      showSpeech("Room reset! Ready for play!");
    });

    // Start engine on page load
    window.onload = function() {
      gameLoop();
    };
  </script>
</body>
