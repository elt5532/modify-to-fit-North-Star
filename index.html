<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMatch: Interactive Playtime Playground</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: '#313A70',
            mustard: '#FFB300',
            rose: '#C9888F',
            mint: '#AFE2CF',
            terracotta: '#C3684D',
            charcoal: '#3D3D3D',
            cream: '#FBF7F1',
            grey: '#98A1A6'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Fredoka', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #313A70;
      font-family: 'Inter', sans-serif;
      user-select: none;
      touch-action: none;
    }
    .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    canvas {
      touch-action: none;
    }
    .toy-btn.active-toy {
      border-color: #FFB300 !important;
      background-color: #FFB300 !important;
      color: #313A70 !important;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255, 179, 0, 0.4);
    }
    .toy-btn-cat.active-toy {
      border-color: #C9888F !important;
      background-color: #C9888F !important;
      color: #FFFFFF !important;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(201, 136, 143, 0.4);
    }
    .pulse-glow {
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 0 5px rgba(255, 179, 0, 0.4); }
      to { box-shadow: 0 0 18px rgba(255, 179, 0, 0.9); }
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between text-charcoal bg-indigo overflow-hidden">

  <header class="bg-cream/95 backdrop-blur border-b-4 border-mustard px-4 py-2 sm:px-6 flex justify-between items-center shadow-lg z-20">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-terracotta flex items-center justify-center text-white text-xl font-bold shadow-md">
        <i class="fa-solid fa-bolt text-mustard"></i>
      </div>
      <div>
        <h1 class="font-display font-bold text-lg sm:text-xl text-indigo leading-tight">PetMatch Playtime Playground</h1>
        <p class="text-xs text-terracotta font-semibold hidden sm:block">Interactive Responsive Dog & Cat Play Room</p>
      </div>
    </div>

    <!-- Trick Counter & Sound Controls -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <div class="bg-indigo/10 border border-indigo/20 px-3 py-1 rounded-full flex items-center space-x-1.5">
        <span class="text-xs font-bold text-indigo uppercase">Combo:</span>
        <span id="comboCounter" class="font-display font-bold text-base text-terracotta">0x</span>
      </div>

      <button id="soundToggle" class="bg-mint hover:bg-opacity-80 text-indigo font-semibold px-3 py-1.5 rounded-full text-xs sm:text-sm flex items-center space-x-1.5 transition shadow">
        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        <span id="soundLabel" class="hidden sm:inline">Sound: ON</span>
      </button>

      <button id="clearRoomBtn" class="bg-rose hover:bg-opacity-90 text-white font-semibold px-3 py-1.5 rounded-full text-xs sm:text-sm flex items-center space-x-1.5 transition shadow">
        <i class="fa-solid fa-rotate-left"></i>
        <span class="hidden sm:inline">Reset Room</span>
      </button>
    </div>
  </header>

  <main class="relative flex-1 w-full bg-cream overflow-hidden flex flex-col items-center justify-center">
    
    <!-- Top Floating Status Overlay -->
    <div class="absolute top-3 left-4 right-4 z-10 flex flex-wrap gap-2 justify-between pointer-events-none">
      
      <!-- Dog Happiness Card -->
      <div class="bg-white/95 backdrop-blur border-2 border-mustard rounded-2xl p-2 sm:p-2.5 shadow-lg flex items-center space-x-2.5 pointer-events-auto min-w-[150px] sm:min-w-[190px]">
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-mustard/20 border-2 border-mustard flex items-center justify-center text-lg sm:text-2xl text-terracotta">
          🐶
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-0.5">
            <span class="font-display font-bold text-xs sm:text-sm text-indigo">Barnaby</span>
            <span id="dogActionTag" class="text-[10px] font-bold text-terracotta bg-mustard/20 px-1.5 py-0.5 rounded-full">Attentive</span>
          </div>
          <div class="w-full bg-slate-200 h-2 sm:h-2.5 rounded-full overflow-hidden border border-slate-300">
            <div id="dogHappyBar" class="bg-mustard h-full transition-all duration-300 w-4/5"></div>
          </div>
        </div>
      </div>

      <!-- Center Action Tip Banner -->
      <div id="actionBanner" class="bg-indigo text-white px-3.5 py-1.5 rounded-2xl shadow-xl border-2 border-mint text-xs sm:text-sm font-medium flex items-center space-x-2 transition-all">
        <i id="actionBannerIcon" class="fa-solid fa-hand-pointer text-mustard"></i>
        <span id="actionBannerText">Click any toy or tap a pet directly to play!</span>
      </div>

      <!-- Cat Happiness Card -->
      <div class="bg-white/95 backdrop-blur border-2 border-rose rounded-2xl p-2 sm:p-2.5 shadow-lg flex items-center space-x-2.5 pointer-events-auto min-w-[150px] sm:min-w-[190px]">
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-rose/20 border-2 border-rose flex items-center justify-center text-lg sm:text-2xl text-rose">
          🐱
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-0.5">
            <span class="font-display font-bold text-xs sm:text-sm text-indigo">Mimi</span>
            <span id="catActionTag" class="text-[10px] font-bold text-rose bg-rose/20 px-1.5 py-0.5 rounded-full">Ready</span>
          </div>
          <div class="w-full bg-slate-200 h-2 sm:h-2.5 rounded-full overflow-hidden border border-slate-300">
            <div id="catHappyBar" class="bg-rose h-full transition-all duration-300 w-3/4"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- The Play Canvas -->
    <canvas id="gameCanvas" class="w-full h-full cursor-crosshair block"></canvas>
  </main>

  <footer class="bg-indigo border-t-4 border-terracotta p-2.5 sm:p-3.5 z-20 shadow-2xl">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2.5">
      
      <!-- Dog Toys Toolbar -->
      <div class="flex items-center space-x-2 w-full md:w-auto justify-center">
        <span class="font-display text-white text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-dog text-mustard"></i> Dog Toys:
        </span>
        <div class="flex space-x-1.5">
          <button data-toy="ball" class="toy-btn active-toy bg-cream text-indigo border-2 border-mustard px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow">
            <span>🎾 Ball</span>
          </button>
          <button data-toy="bone" class="toy-btn bg-cream text-indigo border-2 border-mustard px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow">
            <span>🦴 Bone</span>
          </button>
          <button data-toy="rope" class="toy-btn bg-cream text-indigo border-2 border-mustard px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow">
            <span>🪢 Tug Rope</span>
          </button>
        </div>
      </div>

      <!-- Quick Trick Callouts -->
      <div class="flex items-center space-x-2">
        <button id="dogTrickBtn" class="bg-mustard hover:bg-yellow-400 text-indigo font-display font-bold px-3 py-1.5 rounded-xl text-xs shadow-md border-2 border-white transition active:scale-95 flex items-center space-x-1">
          <span>🐶 Dog Trick!</span>
        </button>
        <button id="catTrickBtn" class="bg-rose hover:bg-pink-400 text-white font-display font-bold px-3 py-1.5 rounded-xl text-xs shadow-md border-2 border-white transition active:scale-95 flex items-center space-x-1">
          <span>🐱 Cat Trick!</span>
        </button>
      </div>

      <!-- Cat Toys Toolbar -->
      <div class="flex items-center space-x-2 w-full md:w-auto justify-center">
        <span class="font-display text-white text-xs sm:text-sm font-bold uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-cat text-rose"></i> Cat Toys:
        </span>
        <div class="flex space-x-1.5">
          <button data-toy="wand" class="toy-btn-cat bg-cream text-indigo border-2 border-rose px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow">
            <span>🪶 Wand</span>
          </button>
          <button data-toy="yarn" class="toy-btn-cat bg-cream text-indigo border-2 border-rose px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow">
            <span>🧶 Yarn</span>
          </button>
          <button data-toy="mouse" class="toy-btn-cat bg-cream text-indigo border-2 border-rose px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1 transition shadow">
            <span>🐭 Mouse</span>
          </button>
        </div>
      </div>

    </div>
  </footer>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBark() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }

      playMeow() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.15);
        osc.frequency.linearRampToValueAtTime(400, now + 0.3);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      playSqueak() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(2200, now + 0.07);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playBounce() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      playTugRumble() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.1);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      playPurr() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(35, now);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }

      playChime() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.2, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.25);
        });
      }
    }

    const soundEngine = new SoundEngine();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let groundY = 0;

    function resizeCanvas() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width;
      canvas.height = height;
      groundY = height * 0.78;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game State Variables
    let activeToyType = 'ball'; // 'ball', 'bone', 'rope', 'wand', 'yarn', 'mouse'
    let dogHappiness = 85;
    let catHappiness = 80;
    let trickCombo = 0;

    const mousePos = { x: width / 2, y: height / 2, isDown: false, isDragging: false, prevX: width / 2, prevY: height / 2, vx: 0, vy: 0 };

    // DOM References
    const dogHappyBar = document.getElementById('dogHappyBar');
    const catHappyBar = document.getElementById('catHappyBar');
    const dogActionTag = document.getElementById('dogActionTag');
    const catActionTag = document.getElementById('catActionTag');
    const actionBannerText = document.getElementById('actionBannerText');
    const comboCounter = document.getElementById('comboCounter');

    function updateBanner(text, iconClass = "fa-solid fa-bolt") {
      actionBannerText.innerText = text;
      document.getElementById('actionBannerIcon').className = `${iconClass} text-mustard`;
    }

    class Particle {
      constructor(x, y, symbol) {
        this.x = x;
        this.y = y;
        this.symbol = symbol;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = -Math.random() * 3 - 2;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 12 + 14;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = `${this.size}px sans-serif`;
        ctx.fillText(this.symbol, this.x, this.y);
        ctx.restore();
      }
    }

    const particles = [];
    function spawnParticles(x, y, symbol, count = 3) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, symbol));
      }
    }

    function drawRoomBackground(ctx) {
      // Wallpaper background base
      ctx.fillStyle = '#FAF6F0';
      ctx.fillRect(0, 0, width, groundY);

      // Cozy warm vertical striped wallpaper (alternating soft cream & warm blush)
      const stripeWidth = 22;
      ctx.fillStyle = '#F2E3DC';
      for (let x = 0; x < width; x += stripeWidth * 2) {
        ctx.fillRect(x, 0, stripeWidth, groundY);
      }

      // Wooden Floor
      ctx.fillStyle = '#E2C39B';
      ctx.fillRect(0, groundY, width, height - groundY);

      // Floor trim/skirting board
      ctx.fillStyle = '#C3684D';
      ctx.fillRect(0, groundY - 12, width, 12);
      ctx.fillStyle = '#A3533B';
      ctx.fillRect(0, groundY - 12, width, 3);

      // Wooden floor planks
      ctx.strokeStyle = '#D4B083';
      ctx.lineWidth = 2;
      const plankHeight = 22;
      for (let y = groundY + plankHeight; y < height; y += plankHeight) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Cozy Center Rug
      const rugX = width * 0.5;
      const rugY = groundY + (height - groundY) * 0.45;
      const rugRx = Math.min(width * 0.35, 260);
      const rugRy = Math.min((height - groundY) * 0.35, 45);

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(rugX, rugY, rugRx, rugRy, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#AFE2CF';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#313A70';
      ctx.stroke();

      // Rug inner pattern ring
      ctx.beginPath();
      ctx.ellipse(rugX, rugY, rugRx * 0.8, rugRy * 0.8, 0, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFB300';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Dog Bed (Left Side)
      const bedX = Math.max(90, width * 0.15);
      const bedY = groundY + 10;
      ctx.save();
      ctx.fillStyle = '#C3684D';
      ctx.beginPath();
      ctx.ellipse(bedX, bedY, 65, 25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FBF7F1';
      ctx.beginPath();
      ctx.ellipse(bedX, bedY - 3, 52, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Cat Tree Scratching Post (Right Side)
      const catTreeX = Math.min(width - 90, width * 0.85);
      const catTreeBaseY = groundY + 15;
      ctx.save();
      // Base
      ctx.fillStyle = '#AFE2CF';
      ctx.fillRect(catTreeX - 45, catTreeBaseY - 10, 90, 15);
      // Post
      ctx.fillStyle = '#C3A37C';
      ctx.fillRect(catTreeX - 10, catTreeBaseY - 140, 20, 130);
      // Twine wrapping lines
      ctx.strokeStyle = '#9A7B56';
      ctx.lineWidth = 2;
      for (let py = catTreeBaseY - 135; py < catTreeBaseY - 10; py += 8) {
        ctx.beginPath(); ctx.moveTo(catTreeX - 10, py); ctx.lineTo(catTreeX + 10, py); ctx.stroke();
      }
      // Top platform
      ctx.fillStyle = '#C9888F';
      ctx.beginPath();
      ctx.roundRect(catTreeX - 50, catTreeBaseY - 155, 100, 18, 8);
      ctx.fill();
      // Hanging pom-pom string
      ctx.strokeStyle = '#313A70';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(catTreeX - 30, catTreeBaseY - 137);
      ctx.lineTo(catTreeX - 30, catTreeBaseY - 100);
      ctx.stroke();
      // Pom-pom
      ctx.fillStyle = '#FFB300';
      ctx.beginPath();
      ctx.arc(catTreeX - 30, catTreeBaseY - 95, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Wall Framed Photo
      ctx.save();
      const frameX = width * 0.5 - 30;
      const frameY = 30;
      ctx.fillStyle = '#C3684D';
      ctx.fillRect(frameX, frameY, 60, 45);
      ctx.fillStyle = '#FBF7F1';
      ctx.fillRect(frameX + 4, frameY + 4, 52, 37);
      ctx.font = '18px sans-serif';
      ctx.fillText('🐶❤️🐱', frameX + 7, frameY + 28);
      ctx.restore();
    }

    class ToyItem {
      constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 16;
        this.rotation = 0;
        this.active = true;
        this.isHeld = false;
        this.trail = [];
      }

      update() {
        if (this.isHeld) return;

        // Mouse Toy erratic movement logic
        if (this.type === 'mouse' && this.active) {
          if (Math.random() < 0.08) {
            this.vx = (Math.random() - 0.5) * 12;
            soundEngine.playSqueak();
          }
        }

        // Gravity & Physics
        this.vy += 0.38;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.97;

        // Ground Collision
        if (this.y + this.radius >= groundY) {
          this.y = groundY - this.radius;
          if (Math.abs(this.vy) > 1.5) {
            this.vy = -this.vy * 0.5;
            soundEngine.playBounce();
          } else {
            this.vy = 0;
          }
        }

        // Walls
        if (this.x < 30) { this.x = 30; this.vx = -this.vx * 0.7; }
        if (this.x > width - 30) { this.x = width - 30; this.vx = -this.vx * 0.7; }

        // Yarn trail
        if (this.type === 'yarn' && Math.abs(this.vx) > 0.5) {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 20) this.trail.shift();
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.type === 'ball') {
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fillStyle = '#CCFF00';
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#FFFFFF';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 9, 0.4, 2.6);
          ctx.stroke();

        } else if (this.type === 'bone') {
          ctx.fillStyle = '#FFFDF9';
          ctx.strokeStyle = '#C3684D';
          ctx.lineWidth = 2;
          ctx.fillRect(-12, -4, 24, 8);
          ctx.beginPath();
          ctx.arc(-12, -5, 5, 0, Math.PI * 2);
          ctx.arc(-12, 5, 5, 0, Math.PI * 2);
          ctx.arc(12, -5, 5, 0, Math.PI * 2);
          ctx.arc(12, 5, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

        } else if (this.type === 'yarn') {
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fillStyle = '#C9888F';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#313A70';
          ctx.stroke();

        } else if (this.type === 'mouse') {
          ctx.fillStyle = '#98A1A6';
          ctx.beginPath();
          ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#C9888F';
          ctx.beginPath();
          ctx.arc(-4, -6, 4, 0, Math.PI * 2);
          ctx.arc(4, -6, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#C9888F';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-12, 0); ctx.quadraticCurveTo(-18, -6, -20, -2);
          ctx.stroke();
        }

        ctx.restore();

        // Draw yarn unraveled thread line
        if (this.type === 'yarn' && this.trail.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#C9888F';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let p of this.trail) ctx.lineTo(p.x, p.y);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    let activeToyInstance = null;

    class Dog {
      constructor(x) {
        this.x = x;
        this.y = groundY - 20;
        this.vx = 0;
        this.vy = 0;
        this.facing = 1;
        this.state = 'ATTENTIVE'; // 'ATTENTIVE', 'SPRINTING', 'LEAPING', 'FETCHING', 'CHEWING', 'TUGGING', 'TRICK'
        this.trickType = 'flip';
        this.trickTimer = 0;
        this.rotation = 0;
        this.tailWag = 0;
        this.walkCycle = 0;
      }

      triggerAction(actionName, targetX, targetY) {
        if (actionName === 'FETCH_BALL') {
          this.state = 'SPRINTING';
          this.targetX = targetX;
          soundEngine.playBark();
          dogActionTag.innerText = "Fetching!";
          updateBanner("Barnaby is sprinting for the ball!", "fa-solid fa-dog");
        } else if (actionName === 'CHEW_BONE') {
          this.state = 'SPRINTING';
          this.targetX = targetX;
          soundEngine.playBark();
          dogActionTag.innerText = "Interested!";
          updateBanner("Barnaby smells the squeaky bone!", "fa-solid fa-bone");
        } else if (actionName === 'TUG_ROPE') {
          this.state = 'TUGGING';
          soundEngine.playTugRumble();
          dogActionTag.innerText = "Tugging!";
          updateBanner("Tug-of-war! Drag mouse to pull with Barnaby!", "fa-solid fa-hand-rock");
        } else if (actionName === 'TRICK') {
          this.state = 'TRICK';
          this.trickTimer = 40;
          this.trickType = Math.random() < 0.5 ? 'flip' : 'spin';
          soundEngine.playBark();
          soundEngine.playChime();
          spawnParticles(this.x, this.y - 30, '⭐', 4);
          dogHappiness = Math.min(100, dogHappiness + 12);
          trickCombo++;
          comboCounter.innerText = `${trickCombo}x`;
          dogActionTag.innerText = "Performing!";
          updateBanner(`Barnaby performed a ${this.trickType === 'flip' ? 'Backflip' : '360 Spin'}!`, "fa-solid fa-star");
        } else if (actionName === 'PETTED') {
          soundEngine.playBark();
          spawnParticles(this.x, this.y - 35, '❤️', 4);
          dogHappiness = Math.min(100, dogHappiness + 15);
          dogActionTag.innerText = "Loved!";
          updateBanner("You petted Barnaby! He's super happy!", "fa-solid fa-heart");
        }
      }

      update() {
        this.tailWag += 0.25;

        // ATTENTIVE STANDBY (No AFK wandering)
        if (this.state === 'ATTENTIVE') {
          this.vx = 0;
          this.rotation = 0;
          const target = activeToyInstance ? activeToyInstance.x : mousePos.x;
          this.facing = target >= this.x ? 1 : -1;
          dogActionTag.innerText = "Attentive";

        } else if (this.state === 'SPRINTING') {
          this.walkCycle += 0.3;
          const dx = this.targetX - this.x;
          this.facing = dx >= 0 ? 1 : -1;

          if (Math.abs(dx) > 20) {
            this.vx = this.facing * 7.5;
            this.x += this.vx;

            // Mid-air leap near target
            if (Math.abs(dx) < 80 && this.y >= groundY - 20) {
              this.vy = -6;
              this.state = 'LEAPING';
            }
          } else {
            this.reachTarget();
          }

        } else if (this.state === 'LEAPING') {
          this.x += this.facing * 6;
          this.vy += 0.4;
          this.y += this.vy;

          if (this.y >= groundY - 20) {
            this.y = groundY - 20;
            this.reachTarget();
          }

        } else if (this.state === 'FETCHING') {
          this.walkCycle += 0.25;
          const returnX = width * 0.25;
          const dx = returnX - this.x;
          this.facing = dx >= 0 ? 1 : -1;

          if (Math.abs(dx) > 15) {
            this.x += this.facing * 5;
          } else {
            // Returned toy!
            if (activeToyInstance) activeToyInstance.isHeld = false;
            this.state = 'ATTENTIVE';
            dogHappiness = Math.min(100, dogHappiness + 10);
            spawnParticles(this.x, this.y - 30, '❤️', 3);
            soundEngine.playBark();
            updateBanner("Good boy! Barnaby brought the ball back!", "fa-solid fa-heart");
          }

        } else if (this.state === 'CHEWING') {
          this.vx = 0;
          this.rotation = Math.sin(this.tailWag * 2) * 0.1;
          if (Math.random() < 0.1) soundEngine.playSqueak();

          this.trickTimer--;
          if (this.trickTimer <= 0) {
            this.state = 'ATTENTIVE';
            dogHappiness = Math.min(100, dogHappiness + 10);
            spawnParticles(this.x, this.y - 30, '🦴', 3);
          }

        } else if (this.state === 'TUGGING') {
          const dx = mousePos.x - this.x;
          this.facing = dx >= 0 ? 1 : -1;
          this.x += (mousePos.x - (this.facing * 40) - this.x) * 0.1;

          if (mousePos.isDragging) {
            soundEngine.playTugRumble();
            dogHappiness = Math.min(100, dogHappiness + 0.3);
            spawnParticles(this.x, this.y - 30, '⚡', 1);
          }
          if (!mousePos.isDown) this.state = 'ATTENTIVE';

        } else if (this.state === 'TRICK') {
          this.trickTimer--;
          if (this.trickType === 'flip') {
            this.rotation = -((40 - this.trickTimer) / 40) * Math.PI * 2;
            this.vy = Math.sin((this.trickTimer / 40) * Math.PI) * -4;
            this.y = groundY - 20 + this.vy * 5;
          } else {
            this.rotation = ((40 - this.trickTimer) / 40) * Math.PI * 2;
          }

          if (this.trickTimer <= 0) {
            this.rotation = 0;
            this.y = groundY - 20;
            this.state = 'ATTENTIVE';
          }
        }

        // Clamp
        this.x = Math.max(50, Math.min(width - 50, this.x));

        // Sync held toy
        if (activeToyInstance && activeToyInstance.isHeld && this.state === 'FETCHING') {
          activeToyInstance.x = this.x + this.facing * 18;
          activeToyInstance.y = this.y - 12;
        }
      }

      reachTarget() {
        if (activeToyType === 'ball') {
          if (activeToyInstance) activeToyInstance.isHeld = true;
          this.state = 'FETCHING';
        } else if (activeToyType === 'bone') {
          this.state = 'CHEWING';
          this.trickTimer = 80;
          soundEngine.playSqueak();
        } else {
          this.state = 'ATTENTIVE';
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.scale(this.facing, 1);

        const legOffset = (this.state === 'SPRINTING' || this.state === 'FETCHING') ? Math.sin(this.walkCycle) * 10 : 0;
        const tailAngle = Math.sin(this.tailWag) * 0.4;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, 15, 26, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Tail
        ctx.save();
        ctx.translate(-22, -10);
        ctx.rotate(-0.5 + tailAngle);
        ctx.strokeStyle = '#FFB300';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-15, -10, -20, -5); ctx.stroke();
        ctx.restore();

        // Legs
        ctx.strokeStyle = '#C3684D';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-12, 0); ctx.lineTo(-12 + legOffset, 15);
        ctx.moveTo(12, 0); ctx.lineTo(12 - legOffset, 15);
        ctx.moveTo(-6, 0); ctx.lineTo(-6 - legOffset, 15);
        ctx.moveTo(18, 0); ctx.lineTo(18 + legOffset, 15);
        ctx.stroke();

        // Body
        ctx.fillStyle = '#FFB300';
        ctx.beginPath();
        ctx.ellipse(0, -5, 24, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.beginPath();
        ctx.ellipse(18, -20, 14, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Snout
        ctx.fillStyle = '#FFFDF9';
        ctx.beginPath();
        ctx.ellipse(25, -17, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#3D3D3D';
        ctx.beginPath(); ctx.arc(30, -19, 3, 0, Math.PI * 2); ctx.fill();

        // Eye (Tracking cursor position)
        ctx.fillStyle = '#3D3D3D';
        ctx.beginPath(); ctx.arc(20, -22, 2.5, 0, Math.PI * 2); ctx.fill();

        // Ear
        ctx.fillStyle = '#313A70';
        ctx.beginPath();
        ctx.ellipse(12, -18, 6, 12, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    class Cat {
      constructor(x) {
        this.x = x;
        this.y = groundY - 20;
        this.vx = 0;
        this.vy = 0;
        this.facing = -1;
        this.state = 'ATTENTIVE'; // 'ATTENTIVE', 'STALKING', 'POUNCING', 'BATTING', 'ROLLING', 'TRICK'
        this.trickTimer = 0;
        this.rotation = 0;
        this.tailWag = 0;
        this.walkCycle = 0;
      }

      triggerAction(actionName, targetX, targetY) {
        if (actionName === 'BAT_WAND') {
          this.state = 'POUNCING';
          this.targetX = targetX;
          this.targetY = targetY;
          soundEngine.playMeow();
          catActionTag.innerText = "Leaping!";
          updateBanner("Mimi is leaping for the feather wand!", "fa-solid fa-feather");
        } else if (actionName === 'ROLL_YARN') {
          this.state = 'STALKING';
          this.targetX = targetX;
          soundEngine.playMeow();
          catActionTag.innerText = "Stalking!";
          updateBanner("Mimi is stalking the yarn ball!", "fa-solid fa-cat");
        } else if (actionName === 'POUNCE_MOUSE') {
          this.state = 'POUNCING';
          this.targetX = targetX;
          this.targetY = groundY - 20;
          soundEngine.playMeow();
          catActionTag.innerText = "Pouncing!";
          updateBanner("Mimi pounces on the wind-up mouse!", "fa-solid fa-bullseye");
        } else if (actionName === 'TRICK') {
          this.state = 'TRICK';
          this.trickTimer = 35;
          soundEngine.playMeow();
          soundEngine.playPurr();
          soundEngine.playChime();
          spawnParticles(this.x, this.y - 35, '💖', 4);
          catHappiness = Math.min(100, catHappiness + 12);
          trickCombo++;
          comboCounter.innerText = `${trickCombo}x`;
          catActionTag.innerText = "Acrobatic!";
          updateBanner("Mimi performed a High Acrobatic Leap!", "fa-solid fa-heart");
        } else if (actionName === 'PETTED') {
          soundEngine.playMeow();
          soundEngine.playPurr();
          spawnParticles(this.x, this.y - 35, '🐾', 4);
          catHappiness = Math.min(100, catHappiness + 15);
          catActionTag.innerText = "Purring!";
          updateBanner("You petted Mimi! She is purring softly!", "fa-solid fa-heart");
        }
      }

      update() {
        this.tailWag += 0.22;

        // ATTENTIVE STANDBY (No AFK wandering)
        if (this.state === 'ATTENTIVE') {
          this.vx = 0;
          this.rotation = 0;
          const target = activeToyInstance ? activeToyInstance.x : mousePos.x;
          this.facing = target >= this.x ? 1 : -1;
          catActionTag.innerText = "Ready";

          // Wand chase reaction when user moves wand near cat
          if (activeToyType === 'wand' && Math.hypot(mousePos.x - this.x, mousePos.y - this.y) < 180) {
            this.triggerAction('BAT_WAND', mousePos.x, mousePos.y);
          }

        } else if (this.state === 'STALKING') {
          this.walkCycle += 0.2;
          const dx = this.targetX - this.x;
          this.facing = dx >= 0 ? 1 : -1;

          if (Math.abs(dx) > 30) {
            this.x += this.facing * 3.5;
          } else {
            this.vy = -7;
            this.state = 'POUNCING';
            soundEngine.playMeow();
          }

        } else if (this.state === 'POUNCING') {
          const dx = (this.targetX || mousePos.x) - this.x;
          this.facing = dx >= 0 ? 1 : -1;
          this.x += this.facing * 6;

          this.vy += 0.45;
          this.y += this.vy;

          if (this.y >= groundY - 20) {
            this.y = groundY - 20;
            this.state = 'ROLLING';
            this.trickTimer = 40;
            soundEngine.playPurr();
            spawnParticles(this.x, this.y - 30, '🐾', 3);
            catHappiness = Math.min(100, catHappiness + 8);
          }

        } else if (this.state === 'ROLLING') {
          this.rotation = Math.sin(this.trickTimer) * 0.3;
          this.trickTimer--;
          if (this.trickTimer <= 0) {
            this.rotation = 0;
            this.state = 'ATTENTIVE';
          }

        } else if (this.state === 'TRICK') {
          this.trickTimer--;
          this.vy = Math.sin((this.trickTimer / 35) * Math.PI) * -6;
          this.y = groundY - 20 + this.vy * 4;
          this.rotation = Math.sin(this.trickTimer * 0.4) * 0.5;

          if (this.trickTimer <= 0) {
            this.rotation = 0;
            this.y = groundY - 20;
            this.state = 'ATTENTIVE';
          }
        }

        // Clamp
        this.x = Math.max(50, Math.min(width - 50, this.x));
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.scale(this.facing, 1);

        const legOffset = (this.state === 'STALKING' || this.state === 'POUNCING') ? Math.sin(this.walkCycle) * 8 : 0;
        const tailAngle = Math.sin(this.tailWag) * 0.5;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, 15, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Sinuous Tail
        ctx.save();
        ctx.translate(-18, -8);
        ctx.strokeStyle = '#C9888F';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-15, -15 + tailAngle * 10, -25, -5 - tailAngle * 10, -20, -25);
        ctx.stroke();
        ctx.restore();

        // Legs
        ctx.strokeStyle = '#313A70';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-10, 0); ctx.lineTo(-10 + legOffset, 15);
        ctx.moveTo(10, 0); ctx.lineTo(10 - legOffset, 15);
        ctx.moveTo(-4, 0); ctx.lineTo(-4 - legOffset, 15);
        ctx.moveTo(14, 0); ctx.lineTo(14 + legOffset, 15);
        ctx.stroke();

        // Body
        ctx.fillStyle = '#C9888F';
        ctx.beginPath();
        ctx.ellipse(0, -5, 20, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body Tabby Stripes
        ctx.strokeStyle = '#313A70';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-6, -16); ctx.lineTo(-6, -6);
        ctx.moveTo(0, -17); ctx.lineTo(0, -5);
        ctx.moveTo(6, -16); ctx.lineTo(6, -6);
        ctx.stroke();

        // Head
        ctx.fillStyle = '#C9888F';
        ctx.beginPath();
        ctx.ellipse(15, -18, 12, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pointy Ears
        ctx.fillStyle = '#313A70';
        ctx.beginPath();
        ctx.moveTo(10, -26); ctx.lineTo(14, -36); ctx.lineTo(18, -26); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(18, -26); ctx.lineTo(22, -36); ctx.lineTo(25, -24); ctx.fill();

        // Eyes (Emerald green slit)
        ctx.fillStyle = '#4E9F3D';
        ctx.beginPath(); ctx.arc(19, -20, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3D3D3D';
        ctx.fillRect(18.5, -22, 1, 4);

        // Whiskers
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(23, -16); ctx.lineTo(32, -18);
        ctx.moveTo(23, -14); ctx.lineTo(33, -14);
        ctx.moveTo(23, -12); ctx.lineTo(31, -10);
        ctx.stroke();

        ctx.restore();
      }
    }

    const dog = new Dog(width * 0.3);
    const cat = new Cat(width * 0.7);

    function drawFeatherWand(ctx) {
      if (activeToyType !== 'wand') return;

      const handleX = mousePos.x;
      const handleY = mousePos.y;
      const tipX = handleX + 40;
      const tipY = handleY - 40;

      ctx.save();
      // Wand stick
      ctx.strokeStyle = '#313A70';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(handleX, handleY);
      ctx.lineTo(tipX, tipY);
      ctx.stroke();

      // String line
      const stringLength = 50;
      const featherX = tipX + Math.sin(Date.now() * 0.008) * 20;
      const featherY = tipY + stringLength;

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(featherX, featherY);
      ctx.stroke();

      // Feathers
      ctx.translate(featherX, featherY);
      ctx.rotate(Math.sin(Date.now() * 0.01) * 0.4);

      const colors = ['#C9888F', '#AFE2CF', '#FFB300'];
      colors.forEach((col, idx) => {
        ctx.save();
        ctx.rotate((idx - 1) * 0.5);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(0, 12, 5, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.restore();
    }

    function drawTugRope(ctx) {
      if (activeToyType !== 'rope' || dog.state !== 'TUGGING') return;

      ctx.save();
      ctx.strokeStyle = '#FFB300';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';

      const startX = mousePos.x;
      const startY = mousePos.y;
      const endX = dog.x + dog.facing * 20;
      const endY = dog.y - 15;

      const midX = (startX + endX) / 2;
      const midY = (startY + endY) / 2 + 15;

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(midX, midY, endX, endY);
      ctx.stroke();

      // Rope knots
      ctx.fillStyle = '#C3684D';
      ctx.beginPath(); ctx.arc(startX, startY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(endX, endY, 8, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function handlePointerDown(e) {
      soundEngine.init();
      const coords = getCanvasCoords(e);
      mousePos.x = coords.x;
      mousePos.y = coords.y;
      mousePos.isDown = true;
      mousePos.isDragging = false;

      // Direct Petting Click Check
      const distToDog = Math.hypot(coords.x - dog.x, coords.y - dog.y);
      const distToCat = Math.hypot(coords.x - cat.x, coords.y - cat.y);

      if (distToDog < 45) {
        dog.triggerAction('PETTED');
        return;
      } else if (distToCat < 40) {
        cat.triggerAction('PETTED');
        return;
      }

      // Handle Toys Actions
      if (activeToyType === 'ball' || activeToyType === 'bone' || activeToyType === 'yarn' || activeToyType === 'mouse') {
        activeToyInstance = new ToyItem(activeToyType, coords.x, coords.y);

        if (activeToyType === 'ball') {
          dog.triggerAction('FETCH_BALL', coords.x, coords.y);
        } else if (activeToyType === 'bone') {
          dog.triggerAction('CHEW_BONE', coords.x, coords.y);
        } else if (activeToyType === 'yarn') {
          cat.triggerAction('ROLL_YARN', coords.x, coords.y);
        } else if (activeToyType === 'mouse') {
          cat.triggerAction('POUNCE_MOUSE', coords.x, coords.y);
        }
      } else if (activeToyType === 'rope') {
        dog.triggerAction('TUG_ROPE', coords.x, coords.y);
      }
    }

    function handlePointerMove(e) {
      const coords = getCanvasCoords(e);
      mousePos.vx = coords.x - mousePos.x;
      mousePos.vy = coords.y - mousePos.y;
      mousePos.x = coords.x;
      mousePos.y = coords.y;

      if (mousePos.isDown) {
        mousePos.isDragging = true;
      }
    }

    function handlePointerUp() {
      if (mousePos.isDown && activeToyInstance && Math.abs(mousePos.vx) > 2) {
        // Toss momentum
        activeToyInstance.vx = mousePos.vx * 0.8;
        activeToyInstance.vy = mousePos.vy * 0.8;
      }
      mousePos.isDown = false;
      mousePos.isDragging = false;
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => { handlePointerDown(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); });
    window.addEventListener('touchend', handlePointerUp);

    // Toy Selection Toolbar Buttons
    const toyBtns = document.querySelectorAll('.toy-btn, .toy-btn-cat');
    toyBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        toyBtns.forEach(b => b.classList.remove('active-toy'));
        btn.classList.add('active-toy');
        activeToyType = btn.getAttribute('data-toy');
        activeToyInstance = null;
        soundEngine.playSqueak();

        const toyNames = {
          ball: "Tennis Ball (Barnaby loves Fetch!)",
          bone: "Squeaky Bone (Squeak for Barnaby!)",
          rope: "Tug-of-War Rope (Pull with Barnaby!)",
          wand: "Feather Wand (Wave for Mimi!)",
          yarn: "Yarn Ball (Roll for Mimi!)",
          mouse: "Wind-Up Mouse (Watch Mimi pounce!)"
        };

        updateBanner(`Selected ${toyNames[activeToyType]}`, "fa-solid fa-gamepad");
      });
    });

    // Trick Buttons
    document.getElementById('dogTrickBtn').addEventListener('click', () => dog.triggerAction('TRICK'));
    document.getElementById('catTrickBtn').addEventListener('click', () => cat.triggerAction('TRICK'));

    // Sound Toggle
    const soundToggleBtn = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');

    soundToggleBtn.addEventListener('click', () => {
      soundEngine.muted = !soundEngine.muted;
      if (soundEngine.muted) {
        soundIcon.className = "fa-solid fa-volume-xmark";
        soundLabel.innerText = "Sound: OFF";
        soundToggleBtn.classList.replace('bg-mint', 'bg-slate-300');
      } else {
        soundIcon.className = "fa-solid fa-volume-high";
        soundLabel.innerText = "Sound: ON";
        soundToggleBtn.classList.replace('bg-slate-300', 'bg-mint');
        soundEngine.playBark();
      }
    });

    // Reset Room Button
    document.getElementById('clearRoomBtn').addEventListener('click', () => {
      activeToyInstance = null;
      dog.x = width * 0.3;
      dog.state = 'ATTENTIVE';
      cat.x = width * 0.7;
      cat.state = 'ATTENTIVE';
      dogHappiness = 85;
      catHappiness = 80;
      trickCombo = 0;
      comboCounter.innerText = "0x";
      soundEngine.playBounce();
      updateBanner("Room reset! Select a toy to begin play.", "fa-solid fa-rotate-left");
    });

    function gameLoop() {
      // Decay happiness slightly over time
      dogHappiness = Math.max(30, dogHappiness - 0.008);
      catHappiness = Math.max(30, catHappiness - 0.008);

      // Update HUD Bars
      dogHappyBar.style.width = `${dogHappiness}%`;
      catHappyBar.style.width = `${catHappiness}%`;

      // Clear Canvas
      ctx.clearRect(0, 0, width, height);

      // Render Environment
      drawRoomBackground(ctx);

      // Render Active Toys
      if (activeToyInstance) {
        activeToyInstance.update();
        activeToyInstance.draw(ctx);
      }

      // Render Wand / Rope Visuals
      drawFeatherWand(ctx);
      drawTugRope(ctx);

      // Update and Draw Pets
      dog.update();
      dog.draw(ctx);

      cat.update();
      cat.draw(ctx);

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }

    // Start Game Engine on Load
    window.onload = function() {
      gameLoop();
    };
  </script>
</body>
</html>
</html>
