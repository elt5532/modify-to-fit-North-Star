<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetMatch: Full Room Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>PetMatch: Full Room Playground</h1>
    <p>Interactive 2.5D Co-Play Experience</p>
  </header>

  <main class="game-container">
    <div class="pet-status">
      <div class="pet-card">🐶 <strong>Barnaby</strong>: Roaming</div>
      <div class="pet-card">🐱 <strong>Mimi</strong>: Exploring</div>
    </div>

    <!-- Canvas where floor PNG and pets render -->
    <canvas id="gameCanvas"></canvas>
  </main>

  <footer class="toy-bar">
    <div>🐶 <strong>Dog Toys:</strong> Ball, Bone, Rope</div>
    <div>🐱 <strong>Cat Toys:</strong> Mouse, Yarn, Feather</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
